<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMEN GR 1</title>
</head>
<body>
    <div class="profil">
        <span class="mine">Ahamada Boina Nailane</span>
        <span class="history">Historique</span>
    </div>
    <div class="form-content">
        <form>
            <div class="infos">
                <h3>Calculatrice</h3>
            </div>
            <fieldset class="content-number">
                <h3>44000</h3>
            </fieldset>
            <div class="button">
                <button class="top">AC</button>
                <button class="top">%</button>
                <button class="top">:</button>
                <button class="right">x</button>
                <button class="after">7</button>
                <button class="after">8</button>
                <button class="after">9</button>
                <button class="right">-</button>
                <button class="after">4</button>
                <button class="after">5</button>
                <button class="after">6</button>
                <button class="right">+</button>
                <button class="after">1</button>
                <button class="after">2</button>
                <button class="after">3</button>
                <button class="right">=</button>
                <button class="zero">0</button>
                <button class="after">.</button>
            </div>
        </form>
    </div>
</body>
</html>
<style>
    body{
        background-color: gray;
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
    }
    .profil{
        padding: 20px;
        display: flex;
        flex-direction: column;
        line-height: 2em;
    }
    .profil .mine{
        color: white;
    }
    .profil .history{
        color: rgb(193, 191, 191);
    }
    form{
        border: 1px solid black;
        border-radius: 20px;
        padding: 10px 10px;
        background: black;
        max-width: 18%;
        margin-left: 40%;
        margin-bottom: 50px;
        box-shadow: 0 0 20px;
        border-right: 10px solid gray;
        border-bottom: 7px solid gray;
    }
    .infos h3{
        font-size: 12px;
        color: white;
        display: flex;
        justify-content: center;
        border: 1px transparent;
        border-radius: 50%;
        padding-top: 12px;
    }
    .infos{
        width: 100%;
        height: 40px;
        background-color: rgb(210, 163, 157);
        border-radius: 50%;
    }
    .content-number{
        background-color: gray;
        border: 1px solid gray;
        border-radius: 5px;
        margin: 10px 0 10px 0;
    }
    .content-number h3{
        display: flex;
        justify-content: flex-end;
        color: white;
        font-size: 20px;
    }
    .button{
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 9px;
    }
    .top, .after{
        border-radius: 50%;
        width: 50px;
        height: 50px;
    }
    .top{
        background-color: rgb(190, 189, 189);
        border: 1px solid rgb(190, 189, 189);
    }
    .after{
        color: white;
        background-color: rgb(72, 72, 72);
        border: 1px solid rgb(72, 72, 72);
    }
    .zero{
        color: white;
        background-color: rgb(72, 72, 72);
        width: 105px;
        height: 50px;
        border-radius: 50px;
        border: 1px solid rgb(72, 72, 72 );
        margin-top: 5px;
    }
    .right{
        color: white;
        background-color: darkorange;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px transparent;
        margin-bottom: 5px;
    }
    .right:hover{
        background-color: rgb(120, 76, 22);
        cursor: pointer;
    }
    .top:hover{
        background-color: white;
        cursor: pointer;
    }
    .after:hover, .zero:hover{
        background-color: rgb(190, 189, 189);
        cursor: pointer;
    }
</style>
